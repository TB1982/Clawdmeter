<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<title>已搬家 — Clawdmeter 動畫編輯器</title>
<!-- The editor was published at this path once, before GitHub Pages was moved
     to serve docs/ as the site root. That URL is out in the world now, so it
     has to keep working.

     Pages serves static files only — there is no server-side 301 available — so
     this is a page that redirects rather than a redirect. The canonical link is
     what tells a crawler which one is real; the meta refresh is what works with
     JavaScript off; location.replace is what keeps the old URL out of the back
     button, so Back goes where the reader came from instead of bouncing them
     here again. The visible link is what is left if all three fail. -->
<link rel="canonical" href="../anim_editor.html">
<meta http-equiv="refresh" content="0; url=../anim_editor.html">
<meta name="robots" content="noindex, follow">
<style>
  :root { color-scheme: dark; }
  body { background:#141414; color:#e8e6e3; margin:0;
         font:15px/1.7 ui-sans-serif,-apple-system,"Noto Sans TC",sans-serif;
         display:flex; min-height:100vh; align-items:center; justify-content:center; }
  main { max-width:34rem; padding:2rem; }
  h1 { font-size:1.15rem; margin:0 0 .75rem; font-weight:600; }
  p { margin:0 0 .6rem; color:#a8a29e; }
  a { color:#DE7552; }
  code { color:#c9c5c0; font-size:.9em; }
</style>
</head>
<body>
<main>
  <h1>編輯器搬到新網址了</h1>
  <p>正在帶你過去。沒有動的話，請點：<br>
     <a href="../anim_editor.html">https://tb1982.github.io/Clawdmeter/anim_editor.html</a></p>
  <p lang="en">The editor moved. Redirecting you now — if nothing happens, use the link above.</p>
</main>
<script>
  // Preserve a hash if one was shared; replace() so Back does not bounce.
  location.replace('../anim_editor.html' + location.hash);
</script>
</body>
</html>
